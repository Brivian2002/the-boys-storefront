<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A437"/>
      <stop offset="50%" stop-color="#E8C158"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Monogram mark: diamond with LG -->
  <g transform="translate(4,4)">
    <path d="M28 0 L52 28 L28 56 L4 28 Z" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.5"/>
    <path d="M28 6 L46 28 L28 50 L10 28 Z" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>
    <text x="28" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a1a1a" letter-spacing="-1">LG</text>
  </g>
  <!-- Wordmark -->
  <g transform="translate(68,0)">
    <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" letter-spacing="4" fill="#1a1a1a">LA GLITZ</text>
    <text x="2" y="46" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="6" fill="#8B6914">ACCRA · GHANA</text>
    <line x1="0" y1="52" x2="60" y2="52" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>
</svg>
